name: Build Standalone Binaries

on:
  push:
    branches:
      - rust

jobs:
  bump_version:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    outputs:
      new_version: ${{ steps.bump.outputs.NEW_VERSION }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Version
        id: bump
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Extract current version from Cargo.toml
          current_version=$(grep -m 1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          
          # Increment the patch version
          IFS='.' read -r major minor patch <<< "$current_version"
          new_patch=$((patch + 1))
          new_version="${major}.${minor}.${new_patch}"
          
          echo "Bumping version from $current_version to $new_version"
          sed -i "0,/version = \"$current_version\"/s//version = \"$new_version\"/" Cargo.toml
          
          git add Cargo.toml
          git commit -m "chore(release): bump version to $new_version"
          git push
          
          echo "NEW_VERSION=$new_version" >> $GITHUB_OUTPUT

  build:
    needs: bump_version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: nano-whale
            asset_name: nano-whale-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: nano-whale
            asset_name: nano-whale-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: nano-whale
            asset_name: nano-whale-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: nano-whale.exe
            asset_name: nano-whale-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: rust # Pull the newly bumped commit from the rust branch
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Build Target
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    needs: [bump_version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Prepare Assets
        run: |
          mkdir release_assets
          find artifacts -type f -exec mv {} release_assets/ \;
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump_version.outputs.new_version }}
          name: Release v${{ needs.bump_version.outputs.new_version }}
          files: release_assets/*
          generate_release_notes: true
